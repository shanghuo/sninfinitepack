# MC 模组开发环境 —— 仅用于开发模组（新容器，不影响现有容器）
# 固定 compose 项目名（与 build-rust 的 docker 目录区分，防止 compose down 误删其他项目容器）
name: mcmod
services:
  dev:
    build:
      context: ./dev
      args:
        PROXY: http://${PROXY_HOST:?请在 .env 设置 PROXY_HOST}
    image: mcmod-dev:latest
    container_name: mcmod-dev
    restart: "no"
    # 资源限制：2 核 4G（与运行中 docker update 一致，防止 compose up 回退）
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
    memswap_limit: 8g
    working_dir: /work/mcmod-1.7.10
    environment:
      HTTP_PROXY: http://${PROXY_HOST:?请在 .env 设置 PROXY_HOST}
      HTTPS_PROXY: http://${PROXY_HOST:?请在 .env 设置 PROXY_HOST}
      NO_PROXY: localhost,127.0.0.1
      JAVA_HOME: /opt/java/openjdk
      JAVA8_HOME: /opt/jdk8
      GRADLE_USER_HOME: /root/.gradle
    volumes:
      - ./mcmod-1.7.10:/work/mcmod-1.7.10   # 1.7.10 模组工程（宿主可见/可编辑）
      - ./mcmod-1.12.2:/work/mcmod-1.12.2   # 1.12.2 模组工程（多版本支持）
      - ./dist:/work/dist            # 构建产物输出
      - ./test:/work/test            # 测试服务器数据（从实例复制）
      - ./scripts:/scripts           # 辅助脚本（bash 脚本，LF 行尾）
      - gradle-home:/root/.gradle    # 持久化 gradle 缓存
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]

volumes:
  gradle-home:
    external: true
    name: docker_gradle-home   # 外部卷（compose 不管理/不删除），gradle 缓存不丢
